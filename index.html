<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=2">
</head>

<body>

    <div class="container flex bg-black">
        <div class="left round">
            <div class="home bg-gray round">
                <div class="logo flex align-items">
                    <img src="assests/logo.svg" alt="logo" class="invert"><span>Spotify</span>
                </div>
                <ul>
                    <li><img src="assests/home.svg" alt="home" class="invert">Home</li>
                    <li><img src="assests/search.svg" alt="search" class="invert">Search</li>
                </ul>
            </div>
            <div class="libary bg-gray round">
                <div class="heading">
                    <img src="assests/lib.svg" alt="Library" class="invert">
                    <h3>Your Library</h3>
                </div>
                <div class="songlist">
                    <ul>
                       
                    </ul>
                </div>
                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>

        </div>
        <div class="right">
            <div class="header">
                <div class="nav">
                    <img src="assests/left-arrow.svg">
                    <img src="assests/left-arrow.svg">
                </div>
                <div class="button">
                    <button>Sign Up</button>
                    <button>Log in</button>
                </div>
            </div>

            <div class="playlist">
                <h2>Spotify Playlist</h2>
                <div class="cardcontainer">
                    <div class="card">
                        <div class="play">
                            <img src="assests/play-button.svg">
                        </div>
                        <img src="assests/Playlist/p1.jpg" alt="king">
                        <h2>Tu Mil Jaaye (From "KING")</h2>
                        <p>Sachin-Jigar,Ed Sheeran,Arijit Singh,...</p>
                    </div>
                    <div class="card">
                        <img src="assests/Playlist/p1.jpg" alt="king">
                        <h2>Tu Mil Jaaye (From "KING")</h2>
                        <p>Sachin-Jigar,Ed Sheeran,Arijit Singh,...</p>
                    </div>
                </div>
            </div>

            <div class="playbar">
                <div class="songinfo"></div>
                <div class="songbutton">
                    <div class="seekbar">
                        <div class="circle"></div>
                    </div>
                    <img src="assests/prev-svgrepo-com.svg" id="prev">
                    <img src="assests/play-svgrepo-com.svg" id="play">
                    <img src="assests/next-svgrepo-com.svg" id="next">
                </div>
                <div class="songtime"></div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
